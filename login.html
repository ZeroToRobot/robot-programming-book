<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Robot Programming Book</title>
  <link rel="icon" href="/favicon-8114d1fc.png" />
  <style>
    :root {
      --bg0: #070b13;
      --blue: #2f6fe6;
      --red: #e5202f;
      --text: #eef2f8;
      --muted: #97a4b8;
      --surface: rgba(255, 255, 255, 0.035);
      --border: rgba(255, 255, 255, 0.09);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background: var(--bg0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      overflow-x: hidden;
    }
    /* Ambient background: navy glow + faint circuit dot-matrix, echoing the cover */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    body::before {
      background:
        radial-gradient(1100px 760px at 50% -12%, #17253f 0%, rgba(14, 22, 38, 0) 60%),
        radial-gradient(820px 640px at 88% 112%, #2a1020 0%, rgba(7, 11, 19, 0) 55%),
        radial-gradient(720px 620px at 6% 108%, #101d3a 0%, rgba(7, 11, 19, 0) 55%);
    }
    body::after {
      background-image: radial-gradient(rgba(126, 158, 224, 0.07) 1px, transparent 1.4px);
      background-size: 24px 24px;
      opacity: 0.55;
      mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    }

    .stage {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 0.9fr 1.1fr;
      gap: 56px;
      align-items: center;
      padding: 44px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 40px 120px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
    }

    /* ---- Cover ---- */
    .cover-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }
    .cover-wrap::before {
      content: "";
      position: absolute;
      inset: -8% -6% -12% -6%;
      background:
        radial-gradient(closest-side, rgba(47, 111, 230, 0.45), transparent 72%),
        radial-gradient(closest-side, rgba(229, 32, 47, 0.30), transparent 70%);
      background-position: 30% 30%, 75% 75%;
      background-repeat: no-repeat;
      background-size: 78% 78%, 70% 70%;
      filter: blur(30px);
      opacity: 0.9;
      z-index: -1;
    }
    .cover {
      display: block;
      width: 100%;
      max-width: 340px;
      height: auto;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow:
        0 2px 0 rgba(255, 255, 255, 0.06) inset,
        0 30px 60px rgba(0, 0, 0, 0.6),
        0 10px 24px rgba(0, 0, 0, 0.5);
      transform: perspective(1400px) rotateY(-6deg) rotateX(1.5deg);
      transition: transform 0.5s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    .cover:hover { transform: perspective(1400px) rotateY(0deg) rotateX(0deg) translateY(-4px); }

    /* ---- Panel ---- */
    .panel { min-width: 0; }
    .kicker {
      margin: 0 0 14px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.9rem, 4.6vw, 2.7rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      font-weight: 800;
    }
    .lead {
      margin: 0 0 26px;
      font-size: 1.02rem;
      line-height: 1.6;
      color: #c3ccda;
      max-width: 42ch;
    }
    .rule {
      display: flex;
      gap: 6px;
      margin: 0 0 28px;
    }
    .rule span {
      height: 4px;
      border-radius: 3px;
    }
    .rule span:nth-child(1) { width: 46px; background: var(--blue); }
    .rule span:nth-child(2) { width: 16px; background: #fff; opacity: 0.9; }
    .rule span:nth-child(3) { width: 30px; background: var(--red); }

    .google-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 13px 22px;
      border-radius: 12px;
      background: #ffffff;
      color: #1b1f24;
      font-size: 1rem;
      font-weight: 650;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .google-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 38px rgba(0, 0, 0, 0.55); }
    .google-btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
    .google-btn svg { width: 20px; height: 20px; flex: none; }

    .note {
      margin: 18px 0 0;
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .author {
      margin: 30px 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(151, 164, 184, 0.75);
    }

    @media (max-width: 780px) {
      .stage {
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 30px 24px;
        text-align: center;
      }
      .cover { max-width: 220px; transform: none; }
      .cover:hover { transform: translateY(-4px); }
      .lead { margin-left: auto; margin-right: auto; }
      .rule { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cover, .google-btn { transition: none; }
      .cover { transform: none; }
    }
  </style>
</head>
